
name: Deploy Snowflake Migrations

on:
  push:
    branches:
      - main
    paths:
      - "migrations/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy migrations to Snowflake
    runs-on: ubuntu-latest

    steps:
      # 1. Repository dosyalarını indir
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python ortamını hazırla
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. schemachange yükle
      - name: Install schemachange
        run: python -m pip install --verbose --no-cache-dir schemachange==4.4.0

      # 4. GitHub Secrets kontrolü
      - name: Diagnose Snowflake variables
        env:
          SF_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SF_USER: ${{ secrets.SNOWFLAKE_USER }}
          SF_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SF_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          for name in SF_ACCOUNT SF_USER SF_WAREHOUSE SF_PASSWORD; do
            if [ -n "${!name}" ]; then
              echo "$name: SET"
            else
              echo "$name: EMPTY"
              exit 1
            fi
          done

      # 5. Snowflake bağlantı dosyasını oluştur
      - name: Configure Snowflake connection
        env:
          SF_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SF_USER: ${{ secrets.SNOWFLAKE_USER }}
          SF_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SF_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path.home() / ".snowflake" / "connections.toml"
          path.parent.mkdir(parents=True, exist_ok=True)

          def toml_string(value):
              return (
                  '"'
                  + value.replace("\\", "\\\\")
                         .replace('"', '\\"')
                         .replace("\n", "\\n")
                  + '"'
              )

          values = {
              "account": os.environ["SF_ACCOUNT"],
              "user": os.environ["SF_USER"],
              "password": os.environ["SF_PASSWORD"],
              "warehouse": os.environ["SF_WAREHOUSE"],
              "role": "ACCOUNTADMIN",
              "database": "SCHEMACHANGE_DEMO",
              "schema": "PUBLIC",
          }

          content = "[default]\n"
          content += "".join(
              f"{key} = {toml_string(value)}\n"
              for key, value in values.items()
          )

          path.touch(mode=0o600)
          path.chmod(0o600)
          path.write_text(content)
          PY

      # 6. Migration dosyalarını Snowflake'e uygula
      - name: Deploy migrations
        run: |
          schemachange deploy \
            --schemachange-root-folder migrations \
            --schemachange-change-history-table SCHEMACHANGE_DEMO.PUBLIC.CHANGE_HISTORY \
            --schemachange-connections-file-path "$HOME/.snowflake/connections.toml" \
            --schemachange-connection-name default
